name: Release

on:
  pull_request:
    branches: [main]
    paths: [.release-please-manifest.json]
    types: [closed]
  workflow_dispatch:
    inputs:
      release_sha:
        description: Merged release commit SHA (leave empty for the first release)
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

env:
  GH_REPO: ${{ github.repository }}

jobs:
  build:
    if: >-
      ${{
        github.repository == 'tomatoaiu/rename-ja' &&
        github.actor == github.repository_owner &&
        (
          (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
          (
            github.event_name == 'pull_request' &&
            github.event.pull_request.merged == true &&
            github.event.pull_request.base.ref == 'main' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.pull_request.user.login == 'github-actions[bot]' &&
            startsWith(github.event.pull_request.head.ref, 'release-please--branches--main') &&
            contains(github.event.pull_request.labels.*.name, 'autorelease: pending')
          )
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: read
      id-token: write
      pull-requests: read
    env:
      RELEASE_SHA: ${{ inputs.release_sha || github.event.pull_request.merge_commit_sha || github.sha }}
    outputs:
      existing: ${{ steps.metadata.outputs.existing }}
      release_pr_number: ${{ steps.metadata.outputs.release_pr_number }}
      release_sha: ${{ steps.metadata.outputs.release_sha }}
      tag: ${{ steps.metadata.outputs.tag }}
      zip_name: ${{ steps.metadata.outputs.zip_name }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_SHA }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.13.0
      - name: Validate release metadata
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_RELEASE_SHA: ${{ inputs.release_sha }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          release_sha=$(git rev-parse HEAD)
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ || "$release_sha" != "$RELEASE_SHA" ]]; then
            echo "Expected an exact 40-character release commit SHA, got ${RELEASE_SHA}." >&2
            exit 1
          fi
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$release_sha" origin/main; then
            echo "Release commit is not on main." >&2
            exit 1
          fi
          if git show-ref --verify --quiet refs/remotes/origin/stable &&
            ! git merge-base --is-ancestor origin/stable "$release_sha"; then
            echo "Release would move stable backwards or off its current history." >&2
            exit 1
          fi

          version=$(node --input-type=module -e '
            import { readFileSync } from "node:fs"
            const json = path => JSON.parse(readFileSync(path, "utf8"))
            const { version } = json(".claude-plugin/plugin.json")
            if (!/^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.test(version)) {
              throw new Error("Invalid plugin version: " + version)
            }
            if (json("package.json").version !== version ||
                json(".release-please-manifest.json")["."] !== version) {
              throw new Error("Plugin, package and release manifest versions must match")
            }
            process.stdout.write(version)
          ')
          tag="v${version}"
          releases=$(gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100")
          existing=$(jq --arg tag "$tag" \
            '[.[][] | select(.tag_name == $tag)] | length' <<< "$releases")
          if [[ "$existing" != "0" ]]; then
            if ! jq -e --arg tag "$tag" \
              'any(.[][]; .tag_name == $tag and .draft == false and .prerelease == false)' \
              <<< "$releases" >/dev/null; then
              echo "Release ${tag} exists but is not a published stable release." >&2
              exit 1
            fi
            if [[ "$(git rev-parse "refs/tags/${tag}^{commit}")" != "$release_sha" ]]; then
              echo "Existing release ${tag} points at a different commit." >&2
              exit 1
            fi
          elif git show-ref --verify --quiet "refs/tags/${tag}"; then
            echo "Tag ${tag} exists without a release; inspect it before retrying." >&2
            exit 1
          fi

          release_pr_number="${PULL_REQUEST_NUMBER:-}"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            release_pr_number=$(gh api \
              "repos/${GITHUB_REPOSITORY}/commits/${release_sha}/pulls" |
              jq -er --arg repository "$GITHUB_REPOSITORY" --arg sha "$release_sha" '
                [ .[] | select(
                  .merged_at != null and .merge_commit_sha == $sha and
                  .base.ref == "main" and .head.repo.full_name == $repository and
                  .user.login == "github-actions[bot]" and
                  (.head.ref | startswith("release-please--branches--main")) and
                  ([.labels[].name] | index("autorelease: pending") != null)
                ) ] |
                if length == 1 then .[0].number
                elif length == 0 then ""
                else error("Expected at most one pending Release Please PR") end
              ')
            if [[ "$existing" == "0" ]]; then
              release_count=$(jq '[.[][]] | length' <<< "$releases")
              if [[ -z "$MANUAL_RELEASE_SHA" && "$release_count" != "0" ]]; then
                echo "A release SHA is required after the first release." >&2
                exit 1
              fi
              if [[ -n "$MANUAL_RELEASE_SHA" && -z "$release_pr_number" ]]; then
                echo "The SHA must identify a merged, pending Release Please PR." >&2
                exit 1
              fi
            fi
          fi

          {
            echo "tag=${tag}"
            echo "existing=${existing}"
            echo "release_pr_number=${release_pr_number}"
            echo "release_sha=${release_sha}"
            echo "zip_name=rename-ja-${version}.zip"
          } >> "$GITHUB_OUTPUT"
      - name: Check metadata and test hooks
        run: npm run check
      - name: Package plugin
        env:
          TAG: ${{ steps.metadata.outputs.tag }}
          ZIP_NAME: ${{ steps.metadata.outputs.zip_name }}
          TZ: UTC
        run: |
          set -euo pipefail

          mkdir -p .output
          git archive --format=zip --output=".output/${ZIP_NAME}" HEAD \
            .claude-plugin/plugin.json hooks LICENSE README.md CHANGELOG.md docs/releasing.md
          zip_version=$(unzip -p ".output/${ZIP_NAME}" .claude-plugin/plugin.json | jq -r '.version')
          if [[ "v${zip_version}" != "$TAG" ]]; then
            echo "ZIP plugin version does not match ${TAG}." >&2
            exit 1
          fi
          (cd .output && sha256sum "$ZIP_NAME" > SHA256SUMS)
      - name: Generate build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: .output/${{ steps.metadata.outputs.zip_name }}
      - name: Verify build provenance
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_NAME: ${{ steps.metadata.outputs.zip_name }}
        run: gh attestation verify ".output/${ZIP_NAME}" --repo "$GITHUB_REPOSITORY"
      - name: Store release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ steps.metadata.outputs.tag }}
          path: |
            .output/${{ steps.metadata.outputs.zip_name }}
            .output/SHA256SUMS
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  publish:
    if: needs.build.result == 'success'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      attestations: read
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ needs.build.outputs.tag }}
          path: release-assets
      - name: Verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_NAME: ${{ needs.build.outputs.zip_name }}
        run: |
          set -euo pipefail

          cd release-assets
          sha256sum --check SHA256SUMS
          gh attestation verify "$ZIP_NAME" --repo "$GITHUB_REPOSITORY"
      - name: Publish immutable release
        if: needs.build.outputs.existing == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.build.outputs.release_sha }}
          TAG: ${{ needs.build.outputs.tag }}
          ZIP_NAME: ${{ needs.build.outputs.zip_name }}
        run: |
          set -euo pipefail

          gh release create "$TAG" \
            "release-assets/${ZIP_NAME}#Claude Code plugin" \
            "release-assets/SHA256SUMS#SHA-256 checksums" \
            --fail-on-no-commits --generate-notes --target "$RELEASE_SHA" --title "$TAG"
      - name: Verify immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          ZIP_NAME: ${{ needs.build.outputs.zip_name }}
        run: |
          set -euo pipefail

          verified=false
          for attempt in 1 2 3 4 5; do
            if gh release verify "$TAG"; then
              verified=true
              break
            fi
            if [[ "$attempt" != "5" ]]; then
              sleep 2
            fi
          done
          if [[ "$verified" != "true" ]]; then
            echo "Release attestation verification failed." >&2
            exit 1
          fi
          gh release verify-asset "$TAG" "release-assets/${ZIP_NAME}"
          gh release verify-asset "$TAG" release-assets/SHA256SUMS
      - name: Advance stable to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.build.outputs.release_sha }}
        run: |
          set -euo pipefail

          refs=$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/heads/stable")
          if jq -e 'any(.[]; .ref == "refs/heads/stable")' <<< "$refs" >/dev/null; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/stable" \
              -f sha="$RELEASE_SHA" -F force=false
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref=refs/heads/stable -f sha="$RELEASE_SHA"
          fi
      - name: Mark release pull request as published
        if: needs.build.outputs.release_pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.build.outputs.release_pr_number }}
        run: >-
          gh pr edit "$PR_NUMBER" --remove-label "autorelease: pending"
