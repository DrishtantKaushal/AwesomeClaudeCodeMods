name: test

on:
  push:
  pull_request:

# it only ever reads the checkout
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # pinned exactly: oxlint ships new correctness rules in minor releases
      - run: bunx --bun oxlint@1.83.0 hooks tests --deny-warnings
      # the game rules and the handle editor; the board needs Claude Code and is not covered here
      - run: bun test
      # no type check here: the 'claude-code' types are generated per machine by /plugin-types and
      # are not in the repo, so tsc only runs locally
